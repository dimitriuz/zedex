name: Release

# Tags only. Push v1.2.3 and this builds it, signs it and publishes it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write        # to create the release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version lives in version.properties and nowhere else; the tag only
      # has to agree with it. Checked here rather than computed, so that a tag
      # cannot quietly build something that calls itself another number - and
      # so that a rebuild of the same tag is identical.
      - name: Check the tag against version.properties
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(sed -n 's/^version=//p' version.properties)"

          case "$file" in
            [0-9]*.[0-9]*) ;;
            *) echo "::error::version.properties says '$file', not MAJOR.MINOR[.PATCH]"; exit 1 ;;
          esac

          [ "$tag" = "$file" ] || {
            echo "::error::tag $GITHUB_REF_NAME and version.properties ($file) disagree"
            exit 1
          }

          echo "VERSION=$file" >> "$GITHUB_ENV"
          echo "Building $file, version from version.properties"

      # Fail here, before a nine-minute build, if the secrets are not set up.
      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ZEDEX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZEDEX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZEDEX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZEDEX_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || {
              echo "::error::secret for $name is not set - see the Releases section of the README"
              exit 1
            }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zedex.jks"
          # A truncated or mis-pasted secret decodes to garbage; catch it now.
          keytool -list -keystore "$RUNNER_TEMP/zedex.jks" \
                  -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::the keystore did not open - check the base64, the password and the alias"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/native

      - name: Assemble and sign
        env:
          ZEDEX_KEYSTORE: ${{ runner.temp }}/zedex.jks
          ZEDEX_KEYSTORE_PASSWORD: ${{ secrets.ZEDEX_KEYSTORE_PASSWORD }}
          ZEDEX_KEY_ALIAS: ${{ secrets.ZEDEX_KEY_ALIAS }}
          ZEDEX_KEY_PASSWORD: ${{ secrets.ZEDEX_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease bundlePlay

      - name: Verify what was built
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || {
            echo "::error::no signed APK - Gradle produced $(ls app/build/outputs/apk/release/)"
            exit 1
          }
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs "$apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libfuse.so" \
              || { echo "::error::$abi/libfuse.so missing from the APK"; exit 1; }
          done

          # This is the build that is *meant* to have All files access - it is
          # the one nobody reviews, and the folder anywhere on storage is what
          # it offers. A removal that went too far would take it out of both.
          "$tools/aapt2" dump permissions "$apk" \
            | grep -q 'MANAGE_EXTERNAL_STORAGE' \
            || { echo "::error::the release APK lost All files access"; exit 1; }

          mv "$apk" "Zedex-$VERSION.apk"
          sha256sum "Zedex-$VERSION.apk" | tee "Zedex-$VERSION.apk.sha256"

      # The artifact for the Play Console. Its one difference from the APK is a
      # permission it does not ask for, so that is what is checked here: a
      # merge that quietly put MANAGE_EXTERNAL_STORAGE back would mean an All
      # files access declaration to defend on every release, and in all
      # likelihood a refused review - and nothing else in the build would say so.
      - name: Verify the Play bundle
        run: |
          aab=app/build/outputs/bundle/play/app-play.aab
          [ -f "$aab" ] || {
            echo "::error::no Play bundle - Gradle produced $(ls app/build/outputs/bundle/play/ 2>&1)"
            exit 1
          }

          # The manifest in a bundle is protobuf, but the permission names are
          # string literals in it either way, and bundletool is not on a runner.
          manifest="$(unzip -p "$aab" base/manifest/AndroidManifest.xml | strings)"

          if printf '%s' "$manifest" | grep -q 'MANAGE_EXTERNAL_STORAGE'; then
            echo "::error::the Play bundle declares All files access - app/src/play/AndroidManifest.xml is not being applied"
            exit 1
          fi

          printf '%s' "$manifest" | grep -q 'android.permission.INTERNET' \
            || { echo "::error::the Play bundle does not ask for INTERNET"; exit 1; }

          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$aab" | grep -q "base/lib/$abi/libfuse.so" \
              || { echo "::error::$abi/libfuse.so missing from the bundle"; exit 1; }
          done

          # Signed with the real key, and specifically not with the debug key
          # that is committed to this repository: the first upload registers its
          # certificate as the app's upload key, so that one would let anybody
          # with a clone sign for Zedex, and a key reset is the only way back.
          # -verbose:summary as well as -certs, and not -certs alone: without
          # the verbose flag jarsigner prints no certificate at all, so a grep
          # for the debug key finds nothing and passes whatever it was handed.
          # Asked once and both questions put to the answer.
          signature="$(jarsigner -verify -verbose:summary -certs "$aab")"

          printf '%s' "$signature" | grep -q 'jar verified' \
            || { echo "::error::the Play bundle is not signed"; exit 1; }

          if printf '%s' "$signature" | grep -q 'CN=Android Debug'; then
            echo "::error::the Play bundle is signed with the repository's debug key - ZEDEX_KEYSTORE was not picked up"
            exit 1
          fi

          mv "$aab" "Zedex-$VERSION.aab"
          sha256sum "Zedex-$VERSION.aab" | tee "Zedex-$VERSION.aab.sha256"

      # Deliberately not a release asset. An .aab cannot be installed, and one
      # sitting beside the APK on the release page is a support question waiting
      # to happen. Take it from the run's artifacts and give that to the Console.
      - uses: actions/upload-artifact@v7
        with:
          # ${{ }} and not $VERSION: a `with:` block is not a shell, and the
          # unexpanded name would be a literal dollar sign in the artifact list.
          name: Zedex-${{ env.VERSION }}-play
          path: |
            Zedex-${{ env.VERSION }}.aab
            Zedex-${{ env.VERSION }}.aab.sha256
          if-no-files-found: error

      # gh is on the runner already, so no third-party action in the release
      # path. Created as a draft: nothing is public until you have installed
      # the APK and pressed publish. Drop --draft to publish on tag.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
              --title "Zedex $VERSION" \
              --generate-notes \
              --draft \
              "Zedex-$VERSION.apk" "Zedex-$VERSION.apk.sha256"
