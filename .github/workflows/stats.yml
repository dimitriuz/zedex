name: Download figures

# GitHub keeps a running total per release asset and no history whatsoever, so the
# only way to know how many downloads happened on a given day is to write the total
# down and subtract later. Once a day is plenty: the figures are a trend, not a
# dashboard, and GitHub's own totals lag by minutes anyway.
#
# The numbers go on a branch of their own, `stats`, holding one file and nothing
# else. A commit a day of data has no business in the history of the app: main
# would gain three hundred and sixty-five "chore: download figures" a year, every
# one of them a push that other workflows would have to be told to ignore, and
# every one of them in the way of `git log`. The page on main reads the branch over
# raw.githubusercontent.com, which allows it from any origin.
on:
  schedule:
    - cron: '17 4 * * *'      # a quiet hour, and not on the hour: cron peaks there
  workflow_dispatch:           # and by hand, for the impatient

permissions:
  contents: write              # to push the data branch, and nothing else

concurrency:
  group: download-figures
  cancel-in-progress: false    # never abandon a run half-committed

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      # main, for the script. The data branch is fetched separately below, because
      # it shares no history with this one and a plain checkout cannot hold both.
      - uses: actions/checkout@v7

      - name: Record today's totals on the data branch
        env:
          BRANCH: stats
          FILE: downloads.csv
        run: |
          # Whatever is on the branch already, or nothing the first time. An orphan
          # branch keeps the app's history out of it entirely - it is one CSV, and
          # sharing a root commit with the source would only invite a merge.
          if git fetch --depth=1 origin "$BRANCH" 2>/dev/null; then
            git worktree add --detach data FETCH_HEAD
            ( cd data && git checkout -B "$BRANCH" )
            echo "branch $BRANCH exists"
          else
            git worktree add --detach data
            ( cd data && git checkout --orphan "$BRANCH" && git rm -rq --cached . || true )
            find data -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            echo "creating $BRANCH"
          fi

          scripts/snapshot-downloads.py --file "data/$FILE"

          cd data

          if git diff --quiet -- "$FILE" && git ls-files --error-unmatch "$FILE" >/dev/null 2>&1; then
            echo "the totals have not moved since the last run"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m "download figures for $(date -u +%F)"
          git push origin "$BRANCH"
