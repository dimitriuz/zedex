name: Build

on:
  push:
    branches: [main]
    # A commit that only touches prose or the stats page cannot change the APK,
    # and the native build is the slow part of this. Worth having quite apart
    # from the daily download-figures commit, which also says [skip ci].
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # First, and before the native build on purpose. Both take a fifth of a
      # second between them and need neither Java nor a compiler, while the
      # native build takes ninety seconds - so a format specifier that would
      # throw a ClassCastException in front of a Polish reader, or a preference
      # read with the wrong getter, fails the job before anything is built.
      # check-prefs.py's own docstring has said "so it can go in a workflow"
      # since it was written; this is that workflow.
      - name: Check the strings and the preferences
        run: |
          python3 scripts/check-strings.py
          python3 scripts/check-prefs.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/native

      - name: Assemble
        run: ./gradlew --no-daemon assembleDebug

      # Fifteen seconds, no device, no emulator. The instrumentation suite
      # cannot run here - it needs an emulator and its waits are sleeps, so it
      # is load-sensitive on a shared runner - but the JVM tier has no such
      # excuse, and it covers the filtering and sorting logic the library is
      # built on.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Keep the unit-test report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # Errors only, and it can fail now - `lint { abortOnError false }` used
      # to mean that even lintVitalRelease, which runs inside assembleRelease,
      # could not stop anything. The first run with it armed found an API 33
      # call on a minSdk 30 build and a percent sign that reads as a format
      # specifier in two translations. The two checks this project disagrees
      # with are off in app/lint.xml, with the reasoning beside each.
      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Keep the lint report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      # Cheap guard against the mistake CLAUDE.md warns about: an APK that
      # packages a stale or missing library. Both ABIs must be in there.
      - name: Check both ABIs are packaged
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libfuse.so" \
              || { echo "::error::$abi/libfuse.so missing from the APK"; exit 1; }
          done
          unzip -l "$apk" | grep -q 'assets/fuse/fuse.font' \
            || { echo "::error::fuse.font missing from the APK"; exit 1; }
          echo "both ABIs and the widget font are present"

      # GitHub zips every artifact on download - that is the artifacts API, not
      # something a workflow can turn off. What it does control is the names:
      # the artifact is Zedex-debug, so the download is Zedex-debug.zip holding
      # one properly named APK rather than app-debug.apk. `gh run download`
      # gives the bare file with no zip at all.
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Zedex-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Zedex-debug
          path: Zedex-debug.apk
          if-no-files-found: error
