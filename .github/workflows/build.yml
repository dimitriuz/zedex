name: Build

on:
  push:
    branches: [main]
    # A commit that only touches prose or the stats page cannot change the APK,
    # and the native build is the slow part of this. Worth having quite apart
    # from the daily download-figures commit, which also says [skip ci].
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/native

      - name: Assemble
        run: ./gradlew --no-daemon assembleDebug

      # Cheap guard against the mistake CLAUDE.md warns about: an APK that
      # packages a stale or missing library. Both ABIs must be in there.
      - name: Check both ABIs are packaged
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libfuse.so" \
              || { echo "::error::$abi/libfuse.so missing from the APK"; exit 1; }
          done
          unzip -l "$apk" | grep -q 'assets/fuse/fuse.font' \
            || { echo "::error::fuse.font missing from the APK"; exit 1; }
          echo "both ABIs and the widget font are present"

      # GitHub zips every artifact on download - that is the artifacts API, not
      # something a workflow can turn off. What it does control is the names:
      # the artifact is Zedex-debug, so the download is Zedex-debug.zip holding
      # one properly named APK rather than app-debug.apk. `gh run download`
      # gives the bare file with no zip at all.
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Zedex-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Zedex-debug
          path: Zedex-debug.apk
          if-no-files-found: error
