name: Build the native core
description: >
  Cross-compiles libspectrum and Fuse with scripts/build-native.sh and leaves
  libfuse.so in app/src/main/jniLibs, ready for Gradle to package.

inputs:
  abis:
    description: Space-separated ABI list, as the script's ABIS variable
    required: false
    default: arm64-v8a armeabi-v7a x86_64

runs:
  using: composite
  steps:
    # The tarballs ship a generated configure, so autoconf itself is not
    # needed. Everything else is already on the runner image; check rather
    # than pay for an apt-get update on every build.
    - name: Host build tools
      shell: bash
      run: |
        missing=
        for tool in make perl pkg-config gcc curl tar sha256sum; do
          command -v "$tool" >/dev/null || missing="$missing $tool"
        done
        if [ -n "$missing" ]; then
          echo "installing:$missing"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $missing
        else
          echo "all present"
        fi

    # Pinned, not "whatever the image ships": the script picks the highest
    # installed NDK, so an image update would silently change compilers.
    # No `yes |` here: steps run under `bash -e -o pipefail`, and sdkmanager
    # closing the pipe on exit kills yes with SIGPIPE, whose non-zero status
    # pipefail then reports as the step failing after a successful install.
    # The runner image has the SDK licences accepted already, so nothing needs
    # to be piped in at all.
    - name: NDK 27.0.12077973
      shell: bash
      run: |
        ndk="$ANDROID_HOME/ndk/27.0.12077973"
        if [ ! -d "$ndk" ]; then
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.0.12077973'
        fi
        [ -d "$ndk" ] || { echo "::error::NDK 27.0.12077973 did not install"; exit 1; }
        echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

    # ~13 MB from SourceForge, whose mirrors are not always quick. The script
    # verifies the SHA-256 either way, so a poisoned cache cannot get through.
    - name: Cache the upstream tarballs
      uses: actions/cache@v6
      with:
        path: vendor/*.tar.gz
        key: vendor-fuse-1.9.1-libspectrum-1.6.3

    # Restoring these skips the libspectrum and Fuse compiles, which is most
    # of the ~90s. Safe: the script always recompiles native/ and relinks, so
    # our own changes still land.
    #
    # The key covers everything that decides what those trees contain, and
    # native/patches is in it because build-native/src is a *patched* copy of
    # Fuse: a cache from before a patch was added restores a source tree
    # without it. fuse-src.sh notices that and remakes the tree, so a stale
    # cache is slow rather than wrong - but it went wrong first, with the
    # cached tree's machine.h missing a declaration that our own code, which is
    # always recompiled, had started to use.
    - name: Cache the native build trees
      uses: actions/cache@v6
      with:
        path: build-native
        key: native-ndk27.0.12077973-${{ hashFiles('scripts/build-native.sh', 'scripts/fuse-src.sh', 'native/patches/*.patch') }}-${{ inputs.abis }}

    - name: Cross-compile
      shell: bash
      env:
        ABIS: ${{ inputs.abis }}
      run: scripts/build-native.sh
