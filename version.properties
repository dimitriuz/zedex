# The one place Zedex's version is set.
#
# The build reads it: app/build.gradle turns `version` into the APK's
# versionName and derives its versionCode as major * 10000 + minor * 100 +
# patch, which is monotonic across releases as long as no component passes 99 -
# what Android requires of a versionCode and what an integer can hold.
#
# A release tag has to agree with this file. The release workflow checks that
# v1.2.3 and version=1.2.3 say the same thing and stops if they do not, so the
# tag, the APK and the source cannot drift apart.
version=1.3.1
