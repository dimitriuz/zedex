plugins {
    id 'com.android.application'
}

/**
 * Puts the demo tape where the APK's assets are gathered from.
 *
 * The tape is built material, not source: scripts/build-demo.py makes it, and
 * staging it from demo/ is what stops the APK shipping a copy older than the
 * tree's. Only the tape - the assembly, the module and the tables beside it are
 * sources and have no business in an APK.
 *
 * A task of its own rather than a Copy, because what it produces has to be an
 * output Gradle can see: a plain directory added to assets.srcDirs is written
 * by one task and read by several, and every reader that is not told so fails
 * the build. Wiring the ones known about got as far as the merge tasks and no
 * further - the release build then stopped on lint, which reads the same
 * directory. addGeneratedSourceDirectory below tells all of them at once.
 */
abstract class StageDemoTape extends DefaultTask {

    @InputFile
    abstract RegularFileProperty getTape()

    @OutputDirectory
    abstract DirectoryProperty getStaged()

    @TaskAction
    void stage() {
        File into = staged.get().asFile
        into.mkdirs()

        java.nio.file.Files.copy(
                tape.get().asFile.toPath(),
                new File(into, tape.get().asFile.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

def stageDemoTape = tasks.register('stageDemoTape', StageDemoTape) {
    tape.set(rootProject.file('demo/zedex.tap'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(
                stageDemoTape, StageDemoTape::getStaged)
    }
}

// Release signing comes from the environment, never from a file in the repo.
// Unset - the normal case locally - leaves the release build unsigned and the
// debug build signed with your own debug key, exactly as before. CI sets these
// from repository secrets; see the Releases section of the README.
def keystorePath = System.getenv('ZEDEX_KEYSTORE')

// The version comes from version.properties at the root of the repository,
// which is the only place it is written down. A -P on the command line still
// wins, for a one-off build; CI does not need one, because the workflow checks
// the tag against that file instead of computing a version of its own.
//
// Computed out here rather than inside the android block because
// `versionCode (x) as int` in there would parse as a cast of the setter's own
// void return.
def zedexVersion = new Properties()
def zedexVersionFile = rootProject.file('version.properties')

if (zedexVersionFile.exists()) {
    zedexVersionFile.withInputStream { zedexVersion.load(it) }
}

def zedexVersionName = project.findProperty('zedexVersionName')
        ?: zedexVersion.getProperty('version')
        ?: '0.0.0'

// 1.2.3 -> 10203. Two digits a component, so 1.10.0 sorts above 1.9.9 as it
// should, and a missing patch counts as zero.
def zedexVersionCode = project.findProperty('zedexVersionCode') as Integer ?: {
    def parts = (zedexVersionName as String).tokenize('.')
    def part = { int i -> (parts.size() > i ? parts[i] : '0') as int }

    if (parts.any { !it.isInteger() } || [0, 1, 2].any { part(it) > 99 }) {
        throw new GradleException(
                "version.properties says '$zedexVersionName', which is not " +
                "MAJOR.MINOR[.PATCH] with every part 99 or less")
    }

    part(0) * 10000 + part(1) * 100 + part(2)
}()

// What this was built from, for the About screen. Taken from git rather than
// from the clock: the same source tree gives the same answer, so it does not
// defeat the build cache the way a timestamp would, and "which commit" is the
// more useful thing to be told anyway. A source download with no git history
// leaves both empty and the screen simply says less.
def gitStamp = { String... command ->
    try {
        def process = (['git'] + (command as List)).execute(null, rootProject.projectDir)
        process.waitForOrKill(5000)
        return process.exitValue() == 0 ? process.text.trim() : ''
    } catch (ignored) {
        return ''
    }
}

def zedexCommit = gitStamp('rev-parse', '--short', 'HEAD')
def zedexDate = gitStamp('log', '-1', '--date=format:%Y-%m-%d', '--format=%cd')

android {
    namespace 'dev.ldlab.zedex'
    compileSdk 36

    // The ROMs live at the root of the repository, beside the licence they
    // travel under, rather than buried three directories inside the app: they
    // are not the app's own material and it reads them as plain files. Their
    // contents land at the root of the assets, which is why Storage.installRoms
    // looks there and takes only what ends in .rom.
    sourceSets {
        main {
            assets.srcDirs += ['../roms']
        }

        /*
         * The updater exists twice: once for real, and once as a stub that
         * answers no.
         *
         * The builds distributed as an APK can offer the newest GitHub release
         * and install it; the one that goes to Play must not, because Play
         * updates its own and an app from the store fetching an APK is against
         * its policy. Two source sets rather than a flag inside one class, so
         * the Play artifact does not carry the code at all - there is nothing in
         * it for a reviewer to ask about, and its manifest has the install
         * permission removed to match.
         */
        debug   { java.srcDirs += 'src/sideload/java' }
        release { java.srcDirs += 'src/sideload/java' }
        play    { java.srcDirs += 'src/noupdate/java' }
    }

    defaultConfig {
        applicationId 'dev.ldlab.zedex'   // must match DATA_ROOT in scripts/build-native.sh
        minSdk 30                        // Android 11, and it stays there
        // Play's floor, and it moves: 36 since August 2027, 35 before that.
        // Independent of minSdk above - this says which behaviours the app has
        // been tested against, not who may install it, and Android 11 and 12
        // are still supported.
        //
        // Bumping it is not only a number. Everything 35 asked for still
        // applies - edge to edge whether the app asks or not, native libraries
        // built for 16 KB pages - and 36 adds:
        //
        //   * predictive back on by default, so an app that handled
        //     KEYCODE_BACK in onKeyDown silently stops being asked. Handled:
        //     EmulatorActivity and LibraryActivity register dispatcher
        //     callbacks from API 33, and keep the old path for 30 to 32.
        //   * orientation, resizability and aspect ratio requests ignored on
        //     displays 600dp and wider. Nothing here asks for any of them.
        //   * the edge-to-edge opt-out gone for good. Never used it.
        //
        // See docs/DEVELOPING.md.
        targetSdk 36
        versionCode zedexVersionCode
        versionName zedexVersionName

        // Resources rather than BuildConfig fields, so nothing has to turn the
        // buildConfig feature on to read them.
        resValue 'string', 'build_commit', zedexCommit
        resValue 'string', 'build_date', zedexDate
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            // Prebuilt by scripts/build-native.sh into src/main/jniLibs
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        // Debug builds are signed with a key that is in the repository, which
        // is the only way one debug APK can replace another. Left to itself
        // Gradle invents a debug key per machine and keeps it in
        // ~/.android/debug.keystore - so a build from CI, where that file does
        // not exist and is created fresh for the run, is signed with a key
        // nothing else has, and Android refuses to install it over anything.
        // Three builds meant three certificates and three uninstalls.
        //
        // Nothing is given away by committing it. It signs debug builds and
        // only debug builds: it is not the release key, it cannot update
        // anything from the Play Store, and its password is the published
        // Android default. Every project that shares debug builds does this.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('ZEDEX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ZEDEX_KEY_ALIAS')
                keyPassword System.getenv('ZEDEX_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // A package of its own, so the debug build and the release one live
            // on a device at once instead of one having to replace the other -
            // which they cannot do anyway, being signed with different keys.
            //
            // This costs nothing now that Fuse finds its data files relative to
            // argv[0]; while it found them through the FUSEDATADIR baked in at
            // configure time, a second package meant a second native build.
            applicationIdSuffix '.debug'
        }

        release {
            // Off, and the rules beside it are still declared on purpose.
            //
            // Turning this on without them is a crash on launch that no debug
            // build can show, and turning it on with only the default file is
            // worse: the class and its natives survive, the three C-called
            // callbacks do not, and the app ships with errors that never
            // appear and recording that writes nothing, silently. Wiring the
            // rules in now means flipping this line is the whole change, and
            // that the reasoning was read before somebody needed it in a
            // hurry. See app/proguard-rules.pro.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'

            // With a key, the real one; without, the debug key. A release built
            // with no key at all is an APK nothing can install - Gradle writes
            // app-release-unsigned.apk and stops - and one given a key of its
            // own could not replace the debug build on a device, since Android
            // will not let one certificate update another. The debug key makes
            // the two interchangeable on the bench, and CI sets ZEDEX_KEYSTORE,
            // so every build anyone else ever sees is signed with the real one.
            signingConfig keystorePath ? signingConfigs.release
                                       : signingConfigs.debug
        }

        // What goes to Google Play: the release build with All files access
        // taken out of the manifest by src/play/AndroidManifest.xml.
        //
        // Play judges an app by the permissions its manifest asks for, not by
        // what it does with them, and MANAGE_EXTERNAL_STORAGE is only allowed
        // where an app cannot work without it. This one can: the default folder
        // is Documents/Zedex, which scoped storage grants for nothing. Leaving
        // the permission declared would mean defending it in the All files
        // access declaration on every release, with the honest answer being
        // "somewhere the user can put a folder", which the policy refuses.
        //
        // A build type rather than a product flavour on purpose. Flavours
        // rename every existing task and output - assembleDebug,
        // connectedDebugAndroidTest, app-release.apk - and both workflows, the
        // docs and the scripts name those. This one only adds assemblePlay and
        // bundlePlay, and touches nothing that already worked.
        play {
            initWith release
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // build-native.sh already strips the libraries it installs; this
            // keeps symbols intact if you drop in an unstripped build to debug
            // a native crash (tombstones then name the failing function).
            keepDebugSymbols += '**/*.so'
        }
    }

    /*
     * Lint runs, and can fail the build.
     *
     * abortOnError was false, which meant not only that `lint` never stopped
     * anything but that lintVitalRelease - which does run as part of
     * assembleRelease - could not either. So the one lint that was already
     * wired into a real build was wired in unable to speak. Turning it on
     * found two things worth having: an API 33 call on a minSdk 30 build
     * whose guard was two methods away, and a percent sign in the Spanish and
     * French sharpness summary that reads as a format specifier.
     *
     * Errors only. There are seventy-odd warnings - unused resources, a
     * handful of accessibility notes, notifyDataSetChanged - and several are
     * things this project has decided about deliberately. Failing on those
     * would mean either a large sweep now or a baseline file, and a baseline
     * is a list of problems nobody looks at again.
     *
     * The two checks that disagree with decisions made here are turned off in
     * app/lint.xml, with the reasoning beside each.
     */
    lint {
        abortOnError true
        lintConfig file('lint.xml')
    }
}

dependencies {
    /*
     * The app's one runtime dependency, and it buys one screen.
     *
     * android.preference has been deprecated since API 29 and its disabled rows
     * are not dimmed at all - which took a FadingListPreference of our own to
     * work around, and made every android:dependency in the app decorative.
     * androidx.preference does that correctly and is still maintained.
     *
     * It brings appcompat with it, which is why SettingsActivity is an
     * AppCompatActivity: PreferenceFragmentCompat will not attach to anything
     * else. Nothing else in the app uses either.
     */
    implementation 'androidx.preference:preference:1.2.1'

    /*
     * The library's browse list. Declared rather than relied upon because a
     * dependency that only exists by way of androidx.preference is one Gradle
     * is free to drop the moment preference stops needing it, and a folder of
     * thousands is exactly the screen that cannot fall back to a hand-rolled
     * list.
     *
     * Above what preference resolves (1.0.0, from 2018), which is the point of
     * declaring it: matching the transitive version made the declaration a
     * no-op and left the app on a seven-year-old copy of the one widget it
     * leans on hardest. 1.3.2's fixes are in measurement and prefetch, which is
     * the territory of the bug CLAUDE.md records losing 1.9 GB to - a page
     * measuring zero because MATCH_PARENT becomes UNSPECIFIED in the scroll
     * direction.
     */
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    /*
     * The JVM tier. Everything in library/ that decides something - what a
     * filter matches, how a field sorts, which values exist - is plain Java
     * with no Android types, so it can be tested here in seconds rather than
     * on a device in minutes. See docs/superpowers/specs for why that
     * boundary was drawn where it was.
     */
    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

/*
 * The one local mistake this project repeats: changing C and installing the
 * old library.
 *
 * Gradle only packages the .so that scripts/build-native.sh has already
 * produced, so it has no idea the sources moved and cheerfully builds an APK
 * with last week's emulator in it. Nothing says so - the app runs, and the
 * change is simply absent. CI is safe, because the runner always runs the
 * script; a bench is not.
 *
 * Compared against the *oldest* library rather than the newest, since a build
 * of one ABI while iterating (ABIS=x86_64 ./scripts/build-native.sh) leaves the
 * others behind on purpose, and it is the stale one that would ship.
 *
 * A warning and not a failure: which ABI is current is a choice while
 * iterating, and a build that refuses to run is a worse answer than one that
 * says what it did. The message carries its own fix.
 */
tasks.named('preBuild').configure {
    doFirst {
        def libs = fileTree('src/main/jniLibs') { include '**/libfuse.so' }.files
        if (libs.isEmpty()) return

        def oldestLib = libs*.lastModified().min()
        def sources = fileTree(rootProject.file('native')) {
            include '**/*.c', '**/*.h', '**/*.patch'
        }.files
        def newer = sources.findAll { it.lastModified() > oldestLib }

        if (!newer.isEmpty()) {
            def names = newer.take(3).collect { rootProject.relativePath(it) }
            logger.warn("\nlibfuse.so is older than ${newer.size()} native "
                        + "source file(s) - ${names.join(', ')}"
                        + (newer.size() > 3 ? ', ...' : '')
                        + "\nThis APK will package the previous build. Run "
                        + "./scripts/build-native.sh first.\n")
        }
    }
}
